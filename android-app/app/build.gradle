plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opining.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.opining.pos"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("release-key.jks")
            storePassword "OpiningStoreRelease2026!"
            keyAlias "opining-key"
            keyPassword "OpiningStoreRelease2026!"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // SUNMI built-in printer SDK (binds to the on-device printer service)
    implementation 'com.sunmi:printerlibrary:1.0.24'
}
